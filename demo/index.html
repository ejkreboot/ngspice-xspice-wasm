<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ngspice Shared Library Demo</title>
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
	<style>
		:root {
			--bg: #f4efe5;
			--panel: rgba(255, 255, 255, 0.78);
			--panel-strong: rgba(255, 255, 255, 0.94);
			--text: #1e2230;
			--muted: #59627a;
			--accent: #0f8a5f;
			--accent-2: #f0ab3a;
			--danger: #b64747;
			--track: #dae3d9;
			--mono: 'JetBrains Mono', monospace;
			--sans: 'Space Grotesk', system-ui, sans-serif;
			--shadow: 0 24px 60px rgba(40, 38, 27, 0.15);
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-height: 100vh;
			color: var(--text);
			font-family: var(--sans);
			background:
				radial-gradient(circle at 15% 20%, rgba(15, 138, 95, 0.12), transparent 30%),
				radial-gradient(circle at 85% 0%, rgba(240, 171, 58, 0.18), transparent 34%),
				linear-gradient(135deg, #efe8dc 0%, #f7f3eb 46%, #ece4d3 100%);
			padding: 28px 18px 40px;
		}

		.shell {
			width: min(1220px, 100%);
			margin: 0 auto;
			background: var(--panel);
			border: 1px solid rgba(30, 34, 48, 0.08);
			border-radius: 24px;
			padding: 26px;
			box-shadow: var(--shadow);
			backdrop-filter: blur(12px);
		}

		header {
			display: flex;
			justify-content: space-between;
			gap: 18px;
			align-items: flex-start;
			margin-bottom: 18px;
		}

		h1 {
			margin: 0;
			font-weight: 600;
			letter-spacing: -0.03em;
			font-size: clamp(28px, 4vw, 38px);
		}

		.eyebrow {
			display: inline-flex;
			align-items: center;
			gap: 10px;
			font-size: 13px;
			letter-spacing: 0.08em;
			text-transform: uppercase;
			color: var(--muted);
		}

		.pill {
			padding: 5px 12px;
			border-radius: 999px;
			background: rgba(15, 138, 95, 0.1);
			color: var(--accent);
			border: 1px solid rgba(15, 138, 95, 0.2);
		}

		.grid {
			display: grid;
			grid-template-columns: minmax(340px, 1fr) minmax(340px, 0.9fr);
			gap: 18px;
		}

		.card {
			background: var(--panel-strong);
			border: 1px solid rgba(30, 34, 48, 0.08);
			border-radius: 18px;
			padding: 16px;
			min-height: 0;
			display: flex;
			flex-direction: column;
			gap: 12px;
		}

		label, .section-title {
			font-size: 13px;
			letter-spacing: 0.04em;
			text-transform: uppercase;
			color: var(--muted);
		}

		textarea {
			width: 100%;
			min-height: 420px;
			background: #fdfbf6;
			color: var(--text);
			border: 1px solid rgba(30, 34, 48, 0.1);
			border-radius: 14px;
			padding: 14px;
			font: 14px/1.45 var(--mono);
			resize: vertical;
			outline: none;
		}

		textarea:focus {
			border-color: rgba(15, 138, 95, 0.5);
			box-shadow: 0 0 0 4px rgba(15, 138, 95, 0.08);
		}

		.controls {
			display: flex;
			gap: 10px;
			flex-wrap: wrap;
			align-items: center;
		}

		button {
			border: none;
			border-radius: 12px;
			padding: 12px 16px;
			font: 600 14px var(--sans);
			cursor: pointer;
			background: linear-gradient(135deg, var(--accent) 0%, #1eb97f 100%);
			color: white;
			box-shadow: 0 3px 6px rgba(15, 138, 95, 0.18);
		}

		button:disabled {
			opacity: 0.55;
			cursor: not-allowed;
			box-shadow: none;
		}

		button.ghost {
			background: transparent;
			color: var(--text);
			border: 1px solid rgba(30, 34, 48, 0.12);
			box-shadow: none;
		}

		.status-line {
			font-size: 14px;
			color: var(--muted);
		}

		.progress-shell {
			display: grid;
			gap: 10px;
		}

		.progress-track {
			height: 16px;
			border-radius: 999px;
			background: var(--track);
			overflow: hidden;
		}

		.progress-fill {
			height: 100%;
			width: 0%;
			background: linear-gradient(90deg, var(--accent-2) 0%, var(--accent) 100%);
			transition: width 0.08s linear;
		}

		.metrics {
			display: grid;
			grid-template-columns: repeat(3, minmax(0, 1fr));
			gap: 10px;
		}

		.metric {
			padding: 12px;
			border-radius: 14px;
			background: #fdfbf6;
			border: 1px solid rgba(30, 34, 48, 0.06);
		}

		.metric strong {
			display: block;
			font-size: 22px;
			margin-top: 6px;
		}

		.plot-wrap {
			position: relative;
			min-height: 340px;
			border-radius: 14px;
			background: #fdfbf6;
			border: 1px solid rgba(30, 34, 48, 0.08);
			overflow: hidden;
		}

		.plot-wrap canvas {
			display: block;
			width: 100%;
			height: 100%;
		}

		.plot-legend {
			display: flex;
			flex-wrap: wrap;
			gap: 10px;
			font-size: 12px;
			font-family: var(--mono);
		}

		.plot-legend .swatch {
			display: inline-block;
			width: 12px;
			height: 12px;
			border-radius: 3px;
			margin-right: 4px;
			vertical-align: middle;
		}

		.note {
			font-size: 13px;
			color: var(--muted);
		}

		@media (max-width: 900px) {
			.grid {
				grid-template-columns: 1fr;
			}

			.metrics {
				grid-template-columns: 1fr;
			}
		}
	</style>
</head>
<body>
	<div class="shell">
		<header>
			<div>
				<h1>ngspice Shared Library Demo</h1>
			</div>
		</header>

		<div class="grid">
			<section class="card">
				<div style="display:flex;align-items:center;gap:12px">
					<label for="netlist" style="margin:0">Netlist</label>
					<select id="exampleSelect" style="font:13px var(--mono);padding:4px 8px;border-radius:8px;border:1px solid rgba(30,34,48,0.12);background:#fdfbf6;color:var(--text)">
						<option value="rc">RC Low-Pass Filter</option>
						<option value="ac-rc">AC Analysis – RC Filter</option>
						<option value="xspice-opamp">XSPICE Opamp Inverting Amp</option>
					</select>
				</div>
				<textarea id="netlist" spellcheck="false"></textarea>
				<div class="controls">
					<button id="run">Run library simulation</button>
					<button id="reset" class="ghost">Reset ngspice</button>
				</div>
				<div class="note">Serve the repository root so this page can fetch <code>../dist/ngspice-lib.js</code>, <code>../dist/ngspice-lib.wasm</code>, the code models, and <code>spinit</code>.</div>
			</section>

			<section class="card">
				<div class="section-title">Progress</div>
				<div class="progress-shell">
					<div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
					<div id="status" class="status-line">Idle</div>
				</div>
				<div class="metrics">
					<div class="metric">
						<div class="section-title">Percent</div>
						<strong id="progressPercent">0.0%</strong>
					</div>
					<div class="metric">
						<div class="section-title">Current Time</div>
						<strong id="currentTime">0 s</strong>
					</div>
					<div class="metric">
						<div class="section-title">Final Time</div>
						<strong id="finalTime">0 s</strong>
					</div>
				</div>
				<div class="section-title">Plot</div>
				<div class="plot-wrap"><canvas id="plotCanvas"></canvas></div>
				<div id="plotLegend" class="plot-legend"></div>
			</section>
		</div>
	</div>

	<script type="module">
		import { NgspiceLibraryClient } from '../dist/ngspice-client.js';

		const COLORS = ['#0f8a5f','#f0ab3a','#b64747','#3a7cf0','#9b59b6','#e67e22','#1abc9c','#e74c3c','#2c3e50','#8e44ad'];

		const EXAMPLES = {
			rc: `* RC Low-Pass Filter
* RC Low-Pass Filter Demo
V1 in1 0 SIN(0 4.5 100)
V2 in2 in1 SIN(0 1 5000)
R1 in2 out 1k
C1 out 0 1u

.control
    tran 10u 20m
.endc
.end
`,
			'ac-rc': `* AC Analysis – RC Low-Pass Filter
V1 in 0 AC 1
R1 in out 1k
C1 out 0 1u

.control
	ac dec 50 1 10Meg
.endc
.end
`,
			'xspice-opamp': `* XSPICE Opamp – Inverting Amplifier
* Uses the XSPICE 'gain' code model from analog.cm

.param Rf = 100k
.param Ri = 10k

Vin in 0 SIN(0 0.5 1k)

* Inverting summing junction
Ri in inv {Ri}
Rf inv out {Rf}

* XSPICE ideal gain block as opamp (high open-loop gain)
* %vd(inv, 0) is the differential input; output drives 'out'
a1 %vd(0, inv) out amp1
.model amp1 gain(gain=1e6 out_offset=0)

* Output load
Rload out 0 10k

.control
	tran 1u 5m
.endc
.end
`,
		};

		const defaultNetlist = EXAMPLES.rc;

		const client = new NgspiceLibraryClient({ workerUrl: '../dist/ngspice-worker.js', assetBaseUrl: '../dist' });
		const netlistEl = document.getElementById('netlist');
		const runBtn = document.getElementById('run');
		const resetBtn = document.getElementById('reset');
		const progressFill = document.getElementById('progressFill');
		const progressPercent = document.getElementById('progressPercent');
		const currentTime = document.getElementById('currentTime');
		const finalTime = document.getElementById('finalTime');
		const statusEl = document.getElementById('status');
		const plotCanvas = document.getElementById('plotCanvas');
		const plotLegend = document.getElementById('plotLegend');

		const exampleSelect = document.getElementById('exampleSelect');
		exampleSelect.value = 'rc';
		netlistEl.value = defaultNetlist;

		exampleSelect.addEventListener('change', () => {
			netlistEl.value = EXAMPLES[exampleSelect.value] || '';
		});

		runBtn.addEventListener('click', async () => {
			setRunning(true);
			resetProgress();

			try {
				const result = await client.run(netlistEl.value, {
					onStatus: (message) => setStatus(message),
					onProgress: ({ progress, currentTime: now, finalTime: stop }) => {
						updateProgress(progress, now, stop);
					},
				});

				updateProgress(result.progress || 1, result.finalTime || 0, result.finalTime || 0);
				setStatus(`Completed (exit ${result.exitCode})`);

				console.log('%c[ngspice] Simulation result:', 'font-weight:bold', result);
				if (result.analyses && result.analyses.length) {
					for (const analysis of result.analyses) {
						console.log(`%c[ngspice] Analysis: ${analysis.type} (${analysis.meta.plotName})`, 'color:#0f8a5f;font-weight:bold', analysis);
					}
					plotAnalysis(result.analyses[0]);
				}
			} catch (error) {
				console.error('[ngspice] Simulation error:', error);
				setStatus('Errored');
			} finally {
				setRunning(false);
			}
		});

		resetBtn.addEventListener('click', async () => {
			try {
				await client.reset();
				setStatus('Reset complete');
				resetProgress();
			} catch (error) {
				console.error('[ngspice] Reset error:', error);
			}
		});

		window.addEventListener('beforeunload', () => {
			client.dispose();
		});

		function setStatus(text) {
			statusEl.textContent = text;
		}

		function setRunning(isRunning) {
			runBtn.disabled = isRunning;
			resetBtn.disabled = isRunning;
		}

		function resetProgress() {
			updateProgress(0, 0, 0);
			setStatus('Idle');
		}

		function updateProgress(progress, now, stop) {
			const percent = Math.max(0, Math.min(progress || 0, 1));
			progressFill.style.width = `${(percent * 100).toFixed(2)}%`;
			progressPercent.textContent = `${(percent * 100).toFixed(1)}%`;
			currentTime.textContent = formatSeconds(now || 0);
			finalTime.textContent = formatSeconds(stop || 0);
		}

		function formatSeconds(value) {
			if (!value) return '0 s';
			if (value >= 1) return `${value.toFixed(4)} s`;
			if (value >= 1e-3) return `${(value * 1e3).toFixed(3)} ms`;
			if (value >= 1e-6) return `${(value * 1e6).toFixed(3)} us`;
			return `${value.toExponential(3)} s`;
		}

		// --- Plotting ---

		function plotAnalysis(analysis) {
			plotLegend.innerHTML = '';

			console.log('%c[plot] analysis input:', 'color:orange', {
				type: analysis.type,
				sweep: analysis.sweep,
				vectorCount: analysis.vectors?.length,
				vectors: analysis.vectors?.map(v => ({ name: v.name, len: v.real?.length })),
			});

			if (!analysis.sweep || analysis.vectors.length === 0) {
				console.warn('[plot] Early return: sweep=%o, vectors.length=%d', analysis.sweep, analysis.vectors?.length);
				const ctx = plotCanvas.getContext('2d');
				ctx.clearRect(0, 0, plotCanvas.width, plotCanvas.height);
				return;
			}

			const isAC = analysis.type === 'ac';
			const sweep = analysis.sweep.values;
			const vectors = analysis.vectors;
			const rect = plotCanvas.parentElement.getBoundingClientRect();
			console.log('[plot] canvas parent rect:', rect.width, 'x', rect.height);
			const dpr = window.devicePixelRatio || 1;
			const W = rect.width * dpr;
			const H = rect.height * dpr;
			plotCanvas.width = W;
			plotCanvas.height = H;
			plotCanvas.style.width = `${rect.width}px`;
			plotCanvas.style.height = `${rect.height}px`;

			const ctx = plotCanvas.getContext('2d');
			ctx.scale(dpr, dpr);
			const w = rect.width;
			const h = rect.height;

			const pad = { top: 16, right: 16, bottom: 36, left: 56 };
			const pw = w - pad.left - pad.right;
			const ph = h - pad.top - pad.bottom;

			// For AC analysis, compute magnitude in dB; otherwise use raw real values
			const yData = vectors.map(vec => {
				if (isAC && vec.complex && vec.imag) {
					const mag = new Float64Array(vec.real.length);
					for (let i = 0; i < vec.real.length; i++) {
						const m = Math.sqrt(vec.real[i] ** 2 + vec.imag[i] ** 2);
						mag[i] = 20 * Math.log10(Math.max(m, 1e-30));
					}
					return mag;
				}
				return vec.real;
			});

			// Compute Y range across all vectors
			let yMin = Infinity, yMax = -Infinity;
			for (const yd of yData) {
				for (let i = 0; i < yd.length; i++) {
					const v = yd[i];
					if (v < yMin) yMin = v;
					if (v > yMax) yMax = v;
				}
			}
			if (yMin === yMax) { yMin -= 1; yMax += 1; }
			const yPad = (yMax - yMin) * 0.06;
			yMin -= yPad;
			yMax += yPad;

			const xMin = sweep[0];
			const xMax = sweep[sweep.length - 1];
			const useLogX = isAC && xMin > 0;

			const toX = useLogX
				? (v) => pad.left + ((Math.log10(v) - Math.log10(xMin)) / (Math.log10(xMax) - Math.log10(xMin))) * pw
				: (v) => pad.left + ((v - xMin) / (xMax - xMin)) * pw;
			const toY = (v) => pad.top + (1 - (v - yMin) / (yMax - yMin)) * ph;

			// Background
			ctx.fillStyle = '#fdfbf6';
			ctx.fillRect(0, 0, w, h);

			// Grid
			ctx.strokeStyle = 'rgba(30,34,48,0.08)';
			ctx.lineWidth = 1;
			const yTicks = niceSteps(yMin, yMax, 6);
			const xTicks = useLogX ? logTicks(xMin, xMax) : niceSteps(xMin, xMax, 6);

			ctx.font = '11px JetBrains Mono, monospace';
			ctx.fillStyle = '#59627a';
			ctx.textAlign = 'right';
			ctx.textBaseline = 'middle';
			for (const t of yTicks) {
				const y = toY(t);
				ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(w - pad.right, y); ctx.stroke();
				ctx.fillText(formatAxis(t), pad.left - 6, y);
			}

			ctx.textAlign = 'center';
			ctx.textBaseline = 'top';
			for (const t of xTicks) {
				const x = toX(t);
				ctx.beginPath(); ctx.moveTo(x, pad.top); ctx.lineTo(x, h - pad.bottom); ctx.stroke();
				ctx.fillText(formatAxis(t), x, h - pad.bottom + 6);
			}

			// Axis labels
			ctx.fillStyle = '#59627a';
			ctx.font = '12px Space Grotesk, system-ui, sans-serif';
			ctx.textAlign = 'center';
			ctx.fillText(`${analysis.sweep.name}${analysis.sweep.unit ? ' (' + analysis.sweep.unit + ')' : ''}`, pad.left + pw / 2, h - 4);

			// Y-axis label for AC
			if (isAC) {
				ctx.save();
				ctx.translate(12, pad.top + ph / 2);
				ctx.rotate(-Math.PI / 2);
				ctx.fillText('dB', 0, 0);
				ctx.restore();
			}

			// Draw traces
			for (let vi = 0; vi < vectors.length; vi++) {
				const vec = vectors[vi];
				const color = COLORS[vi % COLORS.length];
				ctx.strokeStyle = color;
				ctx.lineWidth = 1.5;
				ctx.beginPath();

				// Downsample if many points
				const data = yData[vi];
				const step = Math.max(1, Math.floor(sweep.length / pw));
				for (let i = 0; i < sweep.length; i += step) {
					const x = toX(sweep[i]);
					const y = toY(data[i]);
					if (i === 0) ctx.moveTo(x, y);
					else ctx.lineTo(x, y);
				}
				ctx.stroke();

				// Legend entry
				const entry = document.createElement('span');
				entry.innerHTML = `<span class="swatch" style="background:${color}"></span>${vec.name}${vec.unit ? ' (' + vec.unit + ')' : ''}`;
				plotLegend.appendChild(entry);
			}
		}

		function logTicks(min, max) {
			const ticks = [];
			const startExp = Math.floor(Math.log10(min));
			const endExp = Math.ceil(Math.log10(max));
			for (let e = startExp; e <= endExp; e++) {
				const v = Math.pow(10, e);
				if (v >= min && v <= max) ticks.push(v);
			}
			return ticks;
		}

		function niceSteps(min, max, count) {
			const range = max - min;
			if (range === 0) return [min];
			const rough = range / count;
			const mag = Math.pow(10, Math.floor(Math.log10(rough)));
			const norm = rough / mag;
			let step;
			if (norm < 1.5) step = mag;
			else if (norm < 3.5) step = 2 * mag;
			else if (norm < 7.5) step = 5 * mag;
			else step = 10 * mag;

			const ticks = [];
			let start = Math.ceil(min / step) * step;
			for (let v = start; v <= max + step * 0.001; v += step) {
				ticks.push(v);
			}
			return ticks;
		}

		function formatAxis(v) {
			const abs = Math.abs(v);
			if (abs === 0) return '0';
			if (abs >= 1e6) return (v / 1e6).toPrecision(3) + 'M';
			if (abs >= 1e3) return (v / 1e3).toPrecision(3) + 'k';
			if (abs >= 1) return v.toPrecision(3);
			if (abs >= 1e-3) return (v * 1e3).toPrecision(3) + 'm';
			if (abs >= 1e-6) return (v * 1e6).toPrecision(3) + 'u';
			if (abs >= 1e-9) return (v * 1e9).toPrecision(3) + 'n';
			return v.toExponential(1);
		}
	</script>
</body>
</html>
